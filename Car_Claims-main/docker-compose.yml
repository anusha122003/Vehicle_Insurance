version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: autoshield_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: autoshield_password
      POSTGRES_DB: autoshield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
